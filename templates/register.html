<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | PeakPrep</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0eaff, #e6fff6);
            color: #29243c;
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #ffffff;
            border: 1px solid #e8e0fa;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(83, 63, 125, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: #eee5ff;
            color: #7652c8;
            font-size: 28px;
            font-weight: bold;
        }

        .brand h1 {
            font-size: 29px;
            margin-bottom: 8px;
        }

        .brand h1 span {
            color: #8060d4;
        }

        .brand p {
            color: #777287;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ded8eb;
            border-radius: 11px;
            outline: none;
            font-size: 15px;
            background: #fcfbff;
            color: #29243c;
        }

        input:focus {
            border-color: #9474e3;
            box-shadow: 0 0 0 3px rgba(148, 116, 227, 0.13);
        }

        .password-note {
            margin-top: 7px;
            font-size: 12px;
            color: #817b91;
        }

        .error-message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            background: #fff0f0;
            color: #b42332;
            font-size: 14px;
            line-height: 1.5;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 12px;
            background: #8060d4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            background: #6e4dc1;
            transform: translateY(-1px);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #777287;
            font-size: 14px;
        }

        a {
            color: #7652c8;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 26px 20px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="register-card">
        <div class="brand">
            <div class="brand-icon">P</div>
            <h1>Join <span>PeakPrep</span></h1>
            <p>Create your account and start preparing for JEE.</p>
        </div>

        {% if error %}
            <div class="error-message" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    minlength="3"
                    maxlength="40"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
                <p class="password-note">
                    Use at least 8 characters.
                </p>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter your password again"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Create Account →
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>

        <a class="home-link" href="{{ url_for('home') }}">
            ← Back to Home
        </a>
    </main>

    <script>
        const form = document.querySelector("form");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");

        form.addEventListener("submit", function (event) {
            if (password.value !== confirmPassword.value) {
                event.preventDefault();
                confirmPassword.setCustomValidity("Passwords do not match.");
                confirmPassword.reportValidity();
            } else {
                confirmPassword.setCustomValidity("");
            }
        });

        confirmPassword.addEventListener("input", function () {
            confirmPassword.setCustomValidity("");
        });
    </script>
</body>
</html>
